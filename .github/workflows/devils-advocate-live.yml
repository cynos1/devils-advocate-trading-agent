name: Devil's Advocate — Daily Paper Live

on:
  schedule:
    # 10:30 AM Eastern during the current EDT period
    - cron: "30 14 * * 1-5"

  # Allows us to test it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devils-advocate-paper-live
  cancel-in-progress: false

jobs:
  paper-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      ALPACA_LIVE_TRADE: "false"
      ALPACA_OUTPUT: "json"

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install alpaca-py python-dotenv openai anthropic google-generativeai
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Alpaca CLI
        run: |
          go install github.com/alpacahq/cli/cmd/alpaca@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify Alpaca CLI
        run: |
          alpaca version
          alpaca doctor

      - name: Run deterministic gate tests
        run: |
          python3 -m tests.test_gate

      - name: Capture pre-run Alpaca state
        run: |
          chmod +x scripts/alpaca_cli_audit.sh
          scripts/alpaca_cli_audit.sh pre

      - name: Run Devil's Advocate live
        run: |
          python3 -m agent.run --live

      - name: Capture post-run Alpaca state
        if: always()
        run: |
          scripts/alpaca_cli_audit.sh post
      - name: Capture account performance
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from alpaca.trading.client import TradingClient
      
          client = TradingClient(
              os.environ["ALPACA_API_KEY"],
              os.environ["ALPACA_SECRET_KEY"],
              paper=True
          )
      
          account = client.get_account()
      
          now = datetime.now(timezone.utc)
          today = now.date().isoformat()
      
          snapshot = {
              "date": today,
              "timestamp": now.isoformat(),
              "equity": float(account.equity),
              "cash": float(account.cash),
              "portfolio_value": float(account.portfolio_value),
              "last_equity": float(account.last_equity),
              "starting_equity": 100000.00,
              "source": "Alpaca paper account automated snapshot"
          }
      
          path = Path("data/performance/account_snapshots.json")
          path.parent.mkdir(parents=True, exist_ok=True)
      
          if path.exists():
              with path.open() as f:
                  data = json.load(f)
          else:
              data = {"snapshots": []}
      
          snapshots = data.setdefault("snapshots", [])
      
          # Keep one final snapshot per calendar day.
          snapshots = [
              s for s in snapshots
              if s.get("date") != today
          ]
          snapshots.append(snapshot)
      
          snapshots.sort(key=lambda x: x.get("date", ""))
      
          data["snapshots"] = snapshots
      
          with path.open("w") as f:
              json.dump(data, f, indent=2)
      
          print(f"Performance snapshot saved for {today}")
          print(f"Equity: ${float(account.equity):,.2f}")
          print(f"Cash: ${float(account.cash):,.2f}")
          print(f"Last equity: ${float(account.last_equity):,.2f}")
          PY
      
      - name: Backfill historical performance
        run: |
          python3 scripts/backfill_performance.py
      
      - name: Rebuild judge report
        if: always()
        run: |
          python3 build_report.py

      - name: Update public judge report
        if: always()
        run: |
          cp report/index.html site/judge-report.html
          cp report/summary.json site/summary.json
      
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devils-advocate-${{ github.run_id }}
          retention-days: 30
          path: |
            data/decisions/
            data/cli_audit/
            data/calibration/
            data/performance/
            report/

      - name: Commit audit trail
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/decisions data/cli_audit data/performance report site/judge-report.html site/summary.json || true
          if git diff --cached --quiet; then
            echo "No new audit artifacts."
          else
            git commit -m "audit: daily Devil's Advocate paper run"
            git push || echo "Push blocked; evidence remains in Actions artifact."
          fi
